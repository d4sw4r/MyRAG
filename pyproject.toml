[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myrag"
version = "0.1.0"
description = "Eigenes RAG-System: Ordner einlesen, Dateien indexieren, mit KI befragen."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.14", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
myrag = "myrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
